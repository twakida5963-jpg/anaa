name: Build ANA Award Monitor for macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  qa-and-build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Exhaustive UI patch and QA (1000 x 100)
        run: python3 Scripts/qa_and_patch_ui.py

      - name: Build release
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Assemble universal app
        shell: bash
        run: |
          set -euo pipefail
          APP="ANA特典航空券 空席監視.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp ".build/apple/Products/Release/ANAWatcher" "$APP/Contents/MacOS/ANAWatcher"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleDisplayName</key><string>ANA特典航空券 空席監視</string>
          <key>CFBundleExecutable</key><string>ANAWatcher</string>
          <key>CFBundleIdentifier</key><string>jp.ana-award-monitor.desktop</string>
          <key>CFBundleName</key><string>ANAWatcher</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>2.0.0</string>
          <key>CFBundleVersion</key><string>200</string>
          <key>LSMinimumSystemVersion</key><string>13.0</string>
          </dict></plist>
          PLIST
          chmod +x "$APP/Contents/MacOS/ANAWatcher"

      - name: Verify app binary and bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="ANA特典航空券 空席監視.app"
          BIN="$APP/Contents/MacOS/ANAWatcher"
          test -x "$BIN"
          lipo -info "$BIN" | tee /tmp/lipo.txt
          grep -q "arm64" /tmp/lipo.txt
          grep -q "x86_64" /tmp/lipo.txt
          plutil -lint "$APP/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Contents/Info.plist")" = "ANA特典航空券 空席監視"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          file "$BIN"
          du -h "$BIN"

      - name: Smoke-check critical UI symbols after patch
        shell: bash
        run: |
          set -euo pipefail
          for needle in \
            'import AppKit' \
            'final class BrowserWebContainer: NSView' \
            'webView.leadingAnchor.constraint(equalTo: leadingAnchor)' \
            'webView.trailingAnchor.constraint(equalTo: trailingAnchor)' \
            'webView.topAnchor.constraint(equalTo: topAnchor)' \
            'webView.bottomAnchor.constraint(equalTo: bottomAnchor)' \
            'BrowserWebContainer(webView: tab.webView)' \
            'func updateNSView(_ nsView: BrowserWebContainer' \
            'BrowserTabView(tab: tab)' \
            '.id(tab.id)' \
            '.frame(maxWidth: .infinity, maxHeight: .infinity)' \
            '.clipped()' \
            'createWebViewWith configuration:' \
            'return tab.webView'; do
            grep -Fq -- "$needle" Sources/ANAWatcher/App.swift
          done

      - name: Create verified archive
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent "ANA特典航空券 空席監視.app" "ANA特典航空券-空席監視-macOS-検証済み.zip"
          shasum -a 256 "ANA特典航空券-空席監視-macOS-検証済み.zip"

      - name: Upload verified app
        uses: actions/upload-artifact@v4
        with:
          name: ANA-Award-Monitor-macOS-Verified
          path: ANA特典航空券-空席監視-macOS-検証済み.zip
          if-no-files-found: error
